name: Atualizar painel

on:
  schedule:
    # 9h, 15h e 20h no horário de Brasília (os posts de TV saem às quartas, de manhã ou à tarde)
    - cron: "0 12,18,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Buscar posts novos e gerar o site
        id: build
        run: node scripts/build-site.js

      - name: Salvar posts novos no repositório
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Atualiza dados de audiência"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
